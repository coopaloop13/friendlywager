[project]
name = "friendly-wager-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn",
  "sqlalchemy[asyncio]",
  "asyncpg",
  "alembic",
  "pydantic-settings",
  "argon2-cffi",
  "PyJWT",
  "strawberry-graphql[fastapi]",
  "httpx",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[tool.setuptools]
packages = ["app", "app.gql", "app.sync"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
