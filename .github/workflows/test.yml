name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose run --rm api pytest
      - run: docker compose run --rm --no-deps web npm test -- --run
      - run: docker compose run --rm --no-deps web npm run check
