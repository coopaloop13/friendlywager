<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<meta name="theme-color" content="#ffffff" />
		<script>
			// the look chosen in Settings (lib/look.ts), set before anything paints
			try {
				document.documentElement.dataset.look = localStorage.getItem('fw_look') || 'backyard';
			} catch {}
		</script>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Bricolage+Grotesque:wght@400..800&family=Figtree:wght@400..700&family=Martian+Mono:wght@400..700&display=swap" rel="stylesheet" />
		<style>
			/* Shown until the app renders (ssr is off, and the API may be cold-starting). */
			#boot {
				position: fixed;
				inset: 0;
				display: grid;
				place-content: center;
				justify-items: center;
				gap: 0.75rem;
				background: #f3f4f0;
				color: #1b2a45;
				font: 700 1.1rem 'Bricolage Grotesque', system-ui, sans-serif;
			}
			#boot i {
				width: 44px;
				height: 44px;
				border: 5px solid #b9bfcb;
				border-top-color: #e0aa1e;
				border-radius: 50%;
				animation: fw-boot 0.9s linear infinite;
			}
			[data-look='s112'] #boot {
				background: #161817;
				color: #f2f2ee;
			}
			[data-look='s112'] #boot i {
				border-color: #3f4541;
				border-top-color: #ff5a1f;
			}
			@keyframes fw-boot {
				to {
					transform: rotate(360deg);
				}
			}
			body:has(.app, h1) #boot {
				display: none;
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="tap">
		<div id="boot" role="status">
			<i aria-hidden="true"></i>
			Taking the field…
		</div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
