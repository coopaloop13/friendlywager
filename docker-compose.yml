services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: fw
      POSTGRES_PASSWORD: fw
      POSTGRES_DB: friendly_wager
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fw -d friendly_wager"]
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    build:
      context: ./api
      args:
        INSTALL_DEV: "1"
    env_file: .env
    volumes:
      - ./api:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
  sync:
    image: curlimages/curl
    env_file: .env
    depends_on:
      - api
    entrypoint: ["sh", "-c"]
    command:
      - 'while true; do curl -fsS --retry 15 --retry-connrefused --retry-delay 2 -X POST -H "X-Sync-Secret: $$SYNC_SECRET" http://api:8000/internal/sync; echo; sleep 900; done'
  web:
    build: ./web
    command: npm run dev -- --host 0.0.0.0
    env_file: .env
    volumes:
      - ./web:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api
volumes:
  pgdata:
