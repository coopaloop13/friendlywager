services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: fw
      POSTGRES_PASSWORD: fw
      POSTGRES_DB: friendly_wager
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fw -d friendly_wager"]
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    build:
      context: ./api
      args:
        INSTALL_DEV: "1"
    env_file: .env
    volumes:
      - ./api:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
